<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乗車人数グラフ</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            box-sizing: border-box;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        .total-box {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 12px;
            line-height: 1.4;
            z-index: 1;
        }
        .total-box .total-count {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="barChart"></canvas>
        <div class="total-box" id="totalBox"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        (async () => {
            const allPassengerData = await (await fetch('passenger_data.json')).json();

            const totalSince = allPassengerData.filter(item => item.date >= '2025-04-12');
            const totalCount = totalSince.reduce((sum, item) => sum + (item.am ?? 0) + (item.pm ?? 0), 0);
            const totalAm = totalSince.reduce((sum, item) => sum + (item.am ?? 0), 0);
            const totalPm = totalSince.reduce((sum, item) => sum + (item.pm ?? 0), 0);
            document.getElementById('totalBox').innerHTML =
                `2025.4.12以降の乗車人数合計: <span class="total-count">${totalCount}人</span><br>（午前 ${totalAm}人・午後 ${totalPm}人）`;

            const passengerData = allPassengerData.slice(-40);
            const dateLabels = passengerData.map(item => new Date(item.date));

            const chartDatasets = [
                {
                    label: '乗車人数（午前便）',
                    data: passengerData.map(item => item.am),
                    borderColor: 'rgb(204, 102, 0)',
                    backgroundColor: 'rgba(204, 102, 0, 0.5)',
                    borderWidth: 1,
                },
                {
                    label: '乗車人数（午後便）',
                    data: passengerData.map(item => item.pm),
                    borderColor: 'rgb(0, 102, 204)',
                    backgroundColor: 'rgba(0, 102, 204, 0.5)',
                    borderWidth: 1,
                }
            ];

            const shortDateFormatter = new Intl.DateTimeFormat(undefined, {month: 'numeric', day: 'numeric'});
            const longDateFormatter = new Intl.DateTimeFormat(undefined, {year: 'numeric', month: 'long', day: 'numeric'});

            new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: dateLabels,
                    datasets: chartDatasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            mode: 'index',
                            callbacks: {
                                title: tooltipItems => longDateFormatter.format(dateLabels[tooltipItems[0].dataIndex]),
                                label: tooltipItem => {
                                    const count = tooltipItem.parsed.y;
                                    return count != null ? `${tooltipItem.dataset.label}: ${count}人` : `${tooltipItem.dataset.label}: 記録なし`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                callback: (value, index) => shortDateFormatter.format(dateLabels[index])
                            }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0,
                                callback: value => `${value}人`
                            }
                        }
                    }
                }
            });
        })();
    </script>
</body>
</html>
